name: The DC Archive — Notice Monitor

on:  
  schedule:
    - cron: '0 * * * *'
    - cron: '15 * * * *'
    - cron: '30 * * * *'
    - cron: '45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Cache Python virtual environment
        uses: actions/cache@v3
        with:
          path: venv
          key: ${{ runner.os }}-venv-python3.9-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-python3.9-

      - name: Cache PyMuPDF
        uses: actions/cache@v3
        with:
          path: ~/.cache/pymupdf
          key: ${{ runner.os }}-pymupdf

      - name: Install dependencies
        run: |
          if [ ! -d "venv" ]; then
            python -m venv venv
          fi
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH

      - name: Fetch state from bot-state branch
        run: |
          git fetch origin bot-state || echo "bot-state branch not found on remote"
          git checkout origin/bot-state -- notice_cache.json error_state.json log.json || echo "State files not found in bot-state branch"

      - name: Check for cache files
        run: |
          if [ -f notice_cache.json ]; then
            echo "Found existing cache file"
          else
            echo "No cache file found, will create new one"
          fi
          if [ -f assets/logo.png ]; then
            echo "Logo found"
          else
            echo "Warning: Logo not found"
          fi

      # --- MAIN SCRIPT ---
      - name: Run notice monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      # --- FAILURE HANDLER (Runs if anything above fails) ---
      - name: Handle Runner Failure
        if: failure() 
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python runner_handler.py

      # --- COMMIT (Runs ALWAYS to save state) ---
      - name: Commit and push changes to bot-state
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "The DC Archive Bot"
          
          # Stash state files safely
          mkdir -p /tmp/bot-state
          cp notice_cache.json error_state.json log.json /tmp/bot-state/ 2>/dev/null || true
          
          # Fetch and checkout bot-state branch
          git fetch origin bot-state || true
          if git branch -r | grep -q "origin/bot-state"; then
            git checkout bot-state || git checkout -b bot-state origin/bot-state
          else
            git checkout --orphan bot-state
            git rm -rf .
          fi
          
          # Restore the updated state files
          cp /tmp/bot-state/* . 2>/dev/null || true
          
          # Add and push
          git add notice_cache.json error_state.json log.json
          git diff --staged --quiet || git commit -m "Update state [${{ job.status }}] - $(date)"
          git push origin bot-state || echo "No changes to push"
